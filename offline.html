<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>آفلاین — سیستم مدیریت وام</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Vazirmatn, Tahoma, Arial, sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 380px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }
    .icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 1.35rem; margin-bottom: 10px; font-weight: 800; }
    p { color: #94a3b8; line-height: 1.8; font-size: 0.95rem; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff; border: none; border-radius: 14px;
      padding: 14px 28px; font-size: 15px; font-weight: 700;
      cursor: pointer; width: 100%;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }
    button:active { transform: scale(0.97); }
    .hint { margin-top: 16px; font-size: 0.8rem; color: #64748b; }
  </style>

<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png">
<meta name="theme-color" content="#0A192D">
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>اتصال برقرار نیست</h1>
    <p>شبکه قطع شده است. داده‌های ذخیره‌شده روی دستگاه همچنان در دسترس‌اند. اتصال اینترنت را بررسی کرده و دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش مجدد</button>
    <p class="hint">اگر قبلاً برنامه را باز کرده‌اید، می‌توانید از داده‌های آفلاین استفاده کنید.</p>
  </div>
</body>
</html>
